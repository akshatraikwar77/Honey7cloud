<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Honey Cloud</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="animations.css">
</head>
<body>

<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar(false)"></div>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <a href="index.html" class="sidebar__brand">
      <svg class="logo-mark" width="24" height="24" viewBox="0 0 48 48">
        <defs><linearGradient id="g3" x1="0" y1="0" x2="48" y2="48">
          <stop offset="0%" stop-color="#6366F1"/><stop offset="55%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#22D3EE"/>
        </linearGradient></defs>
        <path d="M13 30C8 30 4 26.2 4 21.5C4 17.1 7.4 13.5 11.8 13.1C13.2 8.5 17.5 5 22.7 5C28.4 5 33.1 9 34.2 14.3C39.2 14.9 43 19 43 24C43 29 39 33 34 33H13Z" fill="url(#g3)"/>
      </svg>
      Honey Cloud
    </a>

    <button class="sidebar__new" onclick="newChat()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      New chat
    </button>

    <div class="sidebar__section-label">Today</div>
    <div class="sidebar__history" id="historyList">
      <!-- populated by chat.js -->
    </div>

    <div class="sidebar__section-label" style="margin-top:auto;">Workspace</div>
    <a href="editor.html" class="sidebar__item">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      Image editor
    </a>

    <div class="sidebar__footer">
      <div class="sidebar__user">
        <div class="sidebar__avatar" id="userAvatar">?</div>
        <span id="userNameLabel" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">—</span>
      </div>
      <button class="btn-icon" title="Log out" onclick="handleLogout()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>

  <main class="workspace">
    <div class="workspace__topbar">
      <button class="btn-icon" id="sidebarToggle" onclick="toggleSidebar()" style="display:none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="trial-pill" id="trialPill">Checking trial status…</div>
      <a href="admin.html" class="gear-link" title="Admin" style="position:static;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </a>
    </div>

    <div class="chat-scroll" id="chatScroll">
      <div class="chat-inner" id="chatInner">
        <div class="chat-empty" id="chatEmpty">
          <svg width="46" height="46" viewBox="0 0 48 48" class="hero-float">
            <path d="M13 30C8 30 4 26.2 4 21.5C4 17.1 7.4 13.5 11.8 13.1C13.2 8.5 17.5 5 22.7 5C28.4 5 33.1 9 34.2 14.3C39.2 14.9 43 19 43 24C43 29 39 33 34 33H13Z" fill="url(#chatCloudGrad)"/>
            <defs><linearGradient id="chatCloudGrad" x1="0" y1="0" x2="48" y2="48">
              <stop offset="0%" stop-color="#6366F1"/><stop offset="55%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#22D3EE"/>
            </linearGradient></defs>
          </svg>
          <h2>What are we building today?</h2>
          <p style="max-width:380px;">Ask for a chat answer, a photo, a video frame, or working code — Honey Cloud picks the right output automatically.</p>
        </div>
      </div>
    </div>

    <div class="composer">
      <div class="composer-inner glass-card">
        <textarea id="promptInput" rows="1" placeholder="Message Honey Cloud… try 'photo of a honeycomb at sunrise'" onkeydown="handleComposerKey(event)"></textarea>
        <div class="composer-tools">
          <button class="tool-toggle" id="searchToggle" onclick="toggleSearch()" title="Ground responses in live web search">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            Search
          </button>
          <button class="btn-icon" id="sendBtn" onclick="sendMessage()" style="background:var(--accent-gradient);">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
      <p class="composer-hint">Honey Cloud can make mistakes. Verify important results.</p>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="main.js"></script>
<script src="auth.js"></script>
<script src="chat.js"></script>
</body>
</html>
